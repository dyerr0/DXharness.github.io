<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>DX HARNESS</title>
    <meta name="description" content="A 3D HARNESS INTERACTION." />
    <link rel="stylesheet" href="css/style.css" />
    <script src="js/three.min.js"></script>
    <script src="js/GLTFLoader.js"></script>
    <script src="js/OrbitControls.js"></script>
    <script src="js/GLBModel.js"></script>
  </head>
  <body>
    <div id="loading-screen">
      <h3 id="loading-text">SWS Digital Harness...</h3>
      <div id="progress-bar"><div id="progress"></div></div>
    </div>
    <div id="container"></div>

    <script>
      const config = {
        containerId: 'container',
        loadingScreenId: 'loading-screen',
        modelPaths: [
          'assets/carro.glb',
          'assets/llantas.glb'
        ],
        keyModels: {
          'Digit1': { off: 'assets/luz_off.glb',         on: 'assets/luz_on.glb' },
          'Digit2': { off: 'assets/parabrisas_off.glb',  on: 'assets/parabrisas_on.glb' },
          'Digit3': { off: 'assets/ventanas_off.glb',  on: 'assets/ventanas_on.glb' },
          'Digit4': { off: 'assets/bolsa_off.glb',          on: 'assets/bolsa_on.glb' },
          'Digit5': { off: 'assets/radio_off.glb',       on: 'assets/radio_on.glb' }
        },
        autoRotate: true,
        rotationSpeed: 0.002,
        cameraPosition: { x: 0, y: 0, z: 3 },
        modelRotation: { x: 0, y: 0, z: 0 },
        lightIntensity: 1,
        ambientLightIntensity: 1.2,
        enabledShadow: false,
        shadowAngle: { x: 0, y: 1, z: 0 },
        controls: {
          enableDamping: true,
          dampingFactor: 0.05,
          screenSpacePanning: false,
          minDistance: 1,
          maxDistance: 10,
          maxPolarAngle: Math.PI / 2,
        },
      };

      GLBModel.init(config);

      // --- Audio para AC y Radio ---
      const audioMap = {
        Digit4: new Audio('assets/bolsa.mp3'),
        Digit5: new Audio('assets/radio.mp3')
      };
      // Loop infinito
      audioMap.Digit4.loop = true;
      audioMap.Digit5.loop = true;


      window.addEventListener('keydown', (e) => {
        if (e.code === 'Digit4') {
          // AC ON → detenemos el sonido
          const ac = audioMap.Digit4;
          if (!ac.paused) {
            ac.pause();
            ac.currentTime = 0;
          }
        } else if (e.code === 'Digit5') {
          // Radio ON → arrancamos
          const radio = audioMap.Digit5;
          if (radio.paused) radio.play();
        }
      });

      window.addEventListener('keyup', (e) => {
        if (e.code === 'Digit4') {
          // AC OFF → reproducimos
          const ac = audioMap.Digit4;
          if (ac.paused) ac.play();
        } else if (e.code === 'Digit5') {
          // Radio OFF → detenemos
          const radio = audioMap.Digit5;
          if (!radio.paused) {
            radio.pause();
            radio.currentTime = 0;
          }
        }
      });
    </script>

    <div class="footer">
      SWS - CONTEC TAB 2025
    </div>
  </body>
</html>
