<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>DX HARNESS</title>
    <meta name="description" content="A 3D HARNESS INTERACTION." />
    <link rel="stylesheet" href="css/style.css" />
    <script src="js/three.min.js"></script>
    <script src="js/GLTFLoader.js"></script>
    <script src="js/OrbitControls.js"></script>
    <script src="js/GLBModel.js"></script>
  </head>
  <body>
    <div id="loading-screen">
      <h3 id="loading-text">Loading...</h3>
      <div id="progress-bar"><div id="progress"></div></div>
    </div>
    <div id="container"></div>

    <script>
      const config = {
        containerId: 'container',
        loadingScreenId: 'loading-screen',

        // Modelos base
        modelPaths: [
          'assets/carro.glb',
          'assets/llantas.glb'
        ],

        // Teclas numéricas + backspace para alternar off/on
        keyModels: {
          'Numpad1': { off: 'assets/luz_off.glb',         on: 'assets/luz_on.glb' },
          'Numpad2': { off: 'assets/parabrisas_off.glb',  on: 'assets/parabrisas_on.glb' },
          'Numpad3': { off: 'assets/ventanas_off.glb',    on: 'assets/ventanas_on.glb' },   <!-- renamed -->
          'NumpadAdd': { off: 'assets/bolsa_off.glb',     on: 'assets/bolsa_on.glb' },      <!-- renamed -->
          'Backspace': { off: 'assets/radio_off.glb',     on: 'assets/radio_on.glb' }
        },

        autoRotate: true,
        rotationSpeed: 0.002,
        cameraPosition: { x: 0, y: 0, z: 3 },
        modelRotation: { x: 0, y: 0, z: 0 },
        lightIntensity: 1,
        ambientLightIntensity: 1.2,
        enabledShadow: false,
        shadowAngle: { x: 0, y: 1, z: 0 },
        controls: {
          enableDamping: true,
          dampingFactor: 0.05,
          screenSpacePanning: false,
          minDistance: 1,
          maxDistance: 10,
          maxPolarAngle: Math.PI / 2,
        },
      };

      GLBModel.init(config);

      // --- Audio para Bolsa y Radio ---
      const audioMap = {
        NumpadAdd: new Audio('assets/bolsa.mp3'),    // Bolsa suena cuando está OFF
        Backspace: new Audio('assets/radio.mp3')    // Radio suena cuando está ON
      };
      audioMap.NumpadAdd.loop = true;
      audioMap.Backspace.loop = true;

      // Arranca Bolsa (OFF) al cargar
      window.addEventListener('DOMContentLoaded', () => {
        const bolsa = audioMap.NumpadAdd;
        bolsa.play().catch(()=>{});
      });

      window.addEventListener('keydown', (e) => {
        if (e.code === 'NumpadAdd') {
          // Bolsa ON → detener sonido
          const bolsa = audioMap.NumpadAdd;
          if (!bolsa.paused) {
            bolsa.pause();
            bolsa.currentTime = 0;
          }
        }
        if (e.code === 'Backspace') {
          // Radio ON → arrancar
          const radio = audioMap.Backspace;
          if (radio.paused) radio.play();
        }
      });

      window.addEventListener('keyup', (e) => {
        if (e.code === 'NumpadAdd') {
          // Bolsa OFF → reproducir
          const bolsa = audioMap.NumpadAdd;
          if (bolsa.paused) bolsa.play();
        }
        if (e.code === 'Backspace') {
          // Radio OFF → detener
          const radio = audioMap.Backspace;
          if (!radio.paused) {
            radio.pause();
            radio.currentTime = 0;
          }
        }
      });
    </script>

    <div class="footer">
      SWS - CONTEC TAB 2025
    </div>
  </body>
</html>
